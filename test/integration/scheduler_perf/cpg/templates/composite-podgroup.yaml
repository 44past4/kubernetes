apiVersion: scheduling.k8s.io/v1beta1
kind: CompositePodGroup
metadata:
  name: cpg-l{{.Level}}-{{.Index}}
spec:
  {{- if gt .Level 1 }}
  parentCompositePodGroupName: cpg-l{{.ParentLevel}}-{{.ParentIndex}}
  {{- end }}
  workloadRef:
    workloadName: cpg-workload
    templateName: cpg-template
  {{- with .priority }}
  priority: {{ . }}
  {{- end }}
  schedulingPolicy:
  {{- if .gang }}
    gang:
      minGroupCount: {{.ChildrenCount}}
  {{- else }}
    basic: {}
  {{- end }}
  {{- if and (eq .Level 2) .childTopologyKey }}
  schedulingConstraints:
    topology:
    - key: {{ .childTopologyKey }}
  {{- else if and (eq .Level 1) .topologyKey }}
  schedulingConstraints:
    topology:
    - key: {{ .topologyKey }}
  {{- end }}
